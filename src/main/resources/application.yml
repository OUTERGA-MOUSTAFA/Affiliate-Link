spring:
  application:
    name: affiliatelink
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/affiliatelink
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100 
  jpa:
    hibernate:
      default_batch_fetch_size: 20  # batch size، Hibernate كيجيبهم بـ query وحدة لكل 20 عرض
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration